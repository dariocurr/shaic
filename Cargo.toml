[workspace]
resolver = "2"
members = ["core", "cli", "tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
assert_cmd = "2.2"
assert_fs = "1.1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
keyring = { version = "4.1", features = ["apple-native-keyring-store", "dbus-secret-service-keyring-store", "windows-native-keyring-store"] }
libc = "0.2"
predicates = "3.1"
ratatui = "0.30"
regex = "1.13"
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
shaic-core = { path = "core" }
shaic-tui = { path = "tui" }
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
walkdir = "2.5"
