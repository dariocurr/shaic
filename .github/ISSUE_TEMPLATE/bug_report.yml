name: Bug report
description: Something is broken or wrong
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: shaic version
      description: Output of `shaic --version`
      placeholder: "0.1.0"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Redact tokens, URLs with credentials, and secret values.
      render: shell
